<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Architectural Shield Emblem -->
  <path d="M32 9 L48 16 V29 C48 42 39 50 32 54 C25 50 16 42 16 29 V16 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stylized Geometric Portal / Tower Pillars -->
  <path d="M25 43 V24 L32 18 L39 24 V43" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="28" y1="30" x2="36" y2="30" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="28" y1="36" x2="36" y2="36" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Golden Keystone Emblem -->
  <polygon points="32,22 36,29 28,29" fill="url(#accent)"/>
  <circle cx="32" cy="33" r="2.5" fill="#ffffff"/>
</svg>
